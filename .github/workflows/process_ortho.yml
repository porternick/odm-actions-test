name: ODM Ortho Only

on:
  workflow_dispatch:

jobs:
  orthophoto:
    name: ODM Orthophoto
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenDroneMap
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/odm-project:/datasets" \
            opendronemap/odm:latest \
            --project-path /datasets \
            project \
            --fast-orthophoto \
            --orthophoto-resolution 5 \
            --skip-report

      - name: Locate orthophoto
        run: |
          find project -type f \
            \( -name "odm_orthophoto.tif" -o -name "odm_orthophoto.tif" \) \
            -print

      - name: Copy final orthophoto
        run: |
          mkdir -p output

          cp \
            project/odm_orthophoto/odm_orthophoto.tif \
            output/orthophoto.tif

      - name: Upload orthophoto
        uses: actions/upload-artifact@v4
        with:
          name: orthophoto
          path: output/orthophoto.tif
          if-no-files-found: error
