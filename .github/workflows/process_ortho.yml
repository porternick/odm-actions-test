name: Process ODM Brighton Beach Dataset

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  process-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Brighton Beach Dataset
        run: |
          echo "Cloning dataset repository..."
          git clone --depth 1 https://github.com/OpenDroneMap/odm_data_brighton_beach.git dataset_temp
          
          # Prepare OpenDroneMap standard project directory structure: project/images
          mkdir -p project/images
          find dataset_temp -maxdepth 2 -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) -exec mv {} project/images/ \;
          
          # Cleanup temporary clone
          rm -rf dataset_temp
          
          echo "Dataset prepared with $(ls -1 project/images | wc -l) images."

      - name: Run OpenDroneMap (Orthophoto Only)
        run: |
          # Run ODM container mounting the local 'project' folder
          # --fast-orthophoto and --skip-3dmodel disable unnecessary 3D reconstruction stages
          docker run --rm \
            -v "$(pwd)/project:/datasets/code" \
            opendronemap/odm:latest \
            --project-path /datasets \
            --fast-orthophoto \
            --skip-3dmodel \
            code

      - name: Verify Orthophoto Output
        run: |
          if [ ! -f "project/odm_orthophoto/odm_orthophoto.tif" ]; then
            echo "Error: ODM failed to produce odm_orthophoto.tif"
            exit 1
          fi
          echo "Orthophoto successfully generated!"
          ls -lh project/odm_orthophoto/

      - name: Upload Orthophoto Artifact
        uses: actions/upload-artifact@v4
        with:
          name: odm-orthophoto
          path: project/odm_orthophoto/
          retention-days: 7
